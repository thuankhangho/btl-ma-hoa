
# Mẫu VirtualHost :443 — chỉ được thêm khi SSL_CERT và SSL_KEY có giá trị
# Cần: a2enmod ssl
<VirtualHost *:443>
    ServerName @DOMAIN@

    SSLEngine on
    SSLCertificateFile    @SSL_CERT@
    SSLCertificateKeyFile @SSL_KEY@

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout @TIMEOUT@
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / @BACKEND@
    ProxyPassReverse / @BACKEND@

    LimitRequestBody @LIMIT@

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"

    ErrorLog  ${APACHE_LOG_DIR}/@APP_NAME@-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/@APP_NAME@-ssl-access.log combined
</VirtualHost>
